<!doctype html>
<!--
  Página web electrónica
  Laboratorio Interactivo de Sistemas de Numeración y Lógica Digital

  Estructura del archivo:
    1. HTML    (encabezado, pestañas y contenedor principal)
    2. CSS     (bloque de estilos, dividido en 11 partes numeradas)
    3. JS      (bloque de script, dividido en 5 secciones y la pantalla principal)

  Todo está en un solo archivo para poder abrirlo con doble clic o enviarlo fácil.
-->
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Laboratorio Interactivo de Sistemas de Numeración y Lógica Digital</title>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&display=swap"
    rel="stylesheet" />
  <style>
    /* ------ 1. COLORES (variables) · cambia aquí la paleta ------ */
    :root {
      --bg: #eef2f4;
      --gr: #dbe3e8;
      --pa: #fff;
      --ink: #14213d;
      --mu: #566174;
      --ac: #0f766e;
      --acb: #ccefe9;
      --on: #c77700;
      --off: #9aa5b4;
      --ok: #15803d;
      --bad: #b91c1c;
      --ln: #c5d0d8;
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* ------ 2. BASE DE LA PÁGINA ------ */
    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      background-image:
        linear-gradient(var(--gr) 1px, transparent 1px),
        linear-gradient(90deg, var(--gr) 1px, transparent 1px);
      background-size: 26px 26px;
      color: var(--ink);
      font:
        16px/1.55 "IBM Plex Sans",
        system-ui,
        sans-serif;
    }

    /* ------ 3. ENCABEZADO Y BITS ------ */
    header {
      padding: 28px 16px 12px;
      max-width: 1040px;
      margin: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
      justify-content: space-between;
    }

    h1 {
      font-size: clamp(1.5rem, 4vw, 2.3rem);
      line-height: 1.15;
      margin: 0;
      max-width: 20ch;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 1.25rem;
    }

    h3 {
      margin: 14px 0 6px;
      font-size: 1rem;
    }

    .bits {
      display: flex;
      gap: 6px;
    }

    .rd {
      margin: 8px 0 0;
      color: var(--mu);
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .rd b {
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
    }

    .bit {
      width: 38px;
      height: 48px;
      font:
        500 1.2rem "IBM Plex Mono",
        monospace;
      border: 2px solid var(--off);
      background: var(--pa);
      color: var(--off);
      border-radius: 6px;
      cursor: pointer;
    }

    .bit.on {
      border-color: var(--on);
      color: var(--on);
      background: var(--pa);
      box-shadow: 0 3px 0 var(--on);
    }

    /* ------ 4. NAVEGACIÓN Y CONTENEDOR PRINCIPAL ------ */
    nav {
      max-width: 1040px;
      margin: auto;
      padding: 0 16px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    main {
      max-width: 1040px;
      margin: 14px auto 40px;
      padding: 0 16px;
    }

    /* ------ 5. BOTONES Y PÍLDORAS ------ */
    button {
      font: inherit;
    }

    .tab,
    .pill {
      border: 1.5px solid var(--ink);
      background: transparent;
      color: var(--ink);
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
    }

    .tab.a,
    .pill.a {
      background: var(--ink);
      color: var(--bg);
    }

    .pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin: 10px 0;
    }

    .pill {
      padding: 5px 12px;
      font-size: 0.92rem;
      border-color: var(--ln);
    }

    .pill.a {
      border-color: var(--ink);
    }

    /* ------ 6. TARJETAS Y CUADRÍCULA ------ */
    .card {
      background: var(--pa);
      border: 1px solid var(--ln);
      border-radius: 10px;
      padding: 16px;
      margin: 12px 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 12px;
    }

    .lbl {
      color: var(--mu);
      font-size: 0.9rem;
    }

    /* ------ 7. FORMULARIOS ------ */
    .mono,
    input,
    table {
      font-family: "IBM Plex Mono", monospace;
    }

    input {
      font-size: 1.1rem;
      padding: 8px 10px;
      border: 1.5px solid var(--ink);
      border-radius: 6px;
      background: var(--bg);
      color: var(--ink);
      width: min(100%, 260px);
      margin: 4px 8px 4px 0;
      text-transform: uppercase;
    }

    .btn {
      background: var(--ac);
      color: #fff;
      border: 0;
      border-radius: 6px;
      padding: 9px 14px;
      cursor: pointer;
      margin: 4px 6px 4px 0;
    }

    .btn.s {
      background: transparent;
      color: var(--ink);
      border: 1.5px solid var(--ln);
    }

    :focus-visible {
      outline: 3px solid var(--on);
      outline-offset: 2px;
    }

    /* ------ 8. RETROALIMENTACIÓN Y TABLAS ------ */
    .fb {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 6px;
      border-left: 5px solid;
    }

    .fb.ok {
      border-color: var(--ok);
      background: var(--acb);
    }

    .fb.bad {
      border-color: var(--bad);
      background: var(--gr);
    }

    ol.st {
      margin: 8px 0 0;
      padding-left: 22px;
      font-size: 0.95rem;
    }

    .tw {
      overflow-x: auto;
    }

    table {
      border-collapse: collapse;
    }

    td,
    th {
      border: 1px solid var(--ln);
      padding: 5px 12px;
      text-align: center;
    }

    tr.h td {
      background: var(--acb);
      font-weight: 600;
    }

    /* ------ 9. SIMULADOR DE PUERTAS LÓGICAS ------ */
    .sw {
      display: flex;
      gap: 10px;
      align-items: center;
      margin: 6px 0;
      flex-wrap: wrap;
    }

    .tg {
      min-width: 74px;
      padding: 8px 12px;
      border-radius: 6px;
      border: 2px solid var(--off);
      background: var(--pa);
      color: var(--off);
      cursor: pointer;
      font:
        500 1rem "IBM Plex Mono",
        monospace;
    }

    .tg.on {
      border-color: var(--on);
      color: var(--on);
      box-shadow: 0 3px 0 var(--on);
    }

    svg .w {
      stroke: var(--off);
      stroke-width: 4;
      fill: none;
    }

    svg .w.on {
      stroke: var(--on);
    }

    svg .g {
      stroke: var(--ink);
      stroke-width: 3;
      fill: var(--pa);
    }

    svg text {
      fill: var(--ink);
      font:
        500 14px "IBM Plex Mono",
        monospace;
    }

    .ex {
      display: block;
      margin: 5px 0;
      font-size: 1.05rem;
      font-family: "IBM Plex Mono", monospace;
    }

    /* ------ 10. ANIMACIONES ------ */
    @media (prefers-reduced-motion: no-preference) {
      .fb {
        animation: f 0.25s;
      }

      @keyframes f {
        from {
          opacity: 0;
        }
      }
    }

    /* ------ 11. SELECTORES (módulo de electrónica) ------ */
    select {
      font: inherit;
      padding: 6px;
      border: 1.5px solid var(--ink);
      border-radius: 6px;
      background: var(--bg);
      color: var(--ink);
      margin: 4px 8px 4px 0;
    }

    label.lbl {
      display: inline-block;
      margin-right: 12px;
    }
  </style>
</head>

<body>
  <!-- Encabezado -->
  <header>
    <div>
      <h1>Laboratorio Interactivo de Sistemas de Numeración y Lógica Digital</h1>
      <p class="lbl" style="margin: 6px 0 0">
        Toca los bits y mira el mismo número en cuatro bases.
      </p>
    </div>
    <div id="hero"></div>
  </header>
  <!-- Pestañas (se generan desde JavaScript) -->
  <nav id="nav"></nav>
  <!-- Contenido principal (se llena desde JavaScript) -->
  <main id="app"></main>
  <!-- JavaScript de la aplicación -->
  <script>

    /* ==========================================================
       SECCIÓN 1 · UTILIDADES GENERALES
       Funciones pequeñas que se usan en toda la página (aleatorios, formato, etc.).
       ========================================================== */
    const $ = (s) => document.querySelector(s),
      R = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a,
      S = (n, b) => n.toString(b).toUpperCase(),
      N = (x) => 1 - x,
      cap = (s) => s[0].toUpperCase() + s.slice(1),
      sh = (a) => a.sort(() => Math.random() - 0.5);

    /* ==========================================================
       SECCIÓN 2 · SISTEMAS DE NUMERACIÓN Y ARITMÉTICA
       Datos, teoría, ejercicios y vista de los 6 módulos de conversión.
       ========================================================== */
    const NM = { 2: "binario", 8: "octal", 10: "decimal", 16: "hexadecimal" },
      DG = { 2: "0 y 1", 8: "0 a 7", 10: "0 a 9", 16: "0 a 9 y A a F" },
      RX = { 2: "01", 8: "0-7", 10: "0-9", 16: "0-9A-F" };
    const TH = {
      2: "Usa solo 0 y 1. Cada posición vale una potencia de 2: …, 16, 8, 4, 2, 1.",
      8: "Usa los dígitos 0 a 7. Cada posición vale una potencia de 8: …, 512, 64, 8, 1.",
      10: "Usa los dígitos 0 a 9. Cada posición vale una potencia de 10: …, 1000, 100, 10, 1.",
      16: "Usa 0 a 9 y letras: A = 10, B = 11, C = 12, D = 13, E = 14, F = 15. Cada posición vale una potencia de 16: …, 4096, 256, 16, 1.",
    };
    const MODS = [
      [10, 2],
      [2, 10],
      [10, 8],
      [8, 10],
      [16, 10],
      [10, 16],
    ],
      LV = ["Básico", "Intermedio", "Avanzado"];
    const MODES = [
      ["conv", "Conversión"],
      ["add", "Suma"],
      ["sub", "Resta"],
      ["mul", "Multiplicación"],
      ["div", "División"],
    ],
      SYM = { add: "+", sub: "−", mul: "×", div: "÷" };
    const RULE = {
      add: "Suma columna a columna, de derecha a izquierda. Si el total alcanza la base, escribes el excedente y llevas 1 (acarreo).",
      sub: "Resta columna a columna. Si el dígito de arriba es menor, pides prestada una unidad de la columna vecina, que vale la base (préstamo).",
      mul: "Multiplica el primer número por cada dígito del segundo, desplaza cada producto una posición más y suma los parciales.",
      div: "División larga: baja cifras, divide el resto parcial entre el divisor y repite. Resultado: cociente entero y residuo. El divisor nunca puede ser 0.",
    };
    const EXA = { add: [11, 7], sub: [13, 6], mul: [6, 5], div: [29, 4] };

    /* ==========================================================
       ESTADO GLOBAL DE LA APLICACIÓN
       Guarda la pestaña activa, el módulo, el nivel y el ejercicio actual.
       ========================================================== */
    let st = {
      tab: "num",
      m: 0,
      mode: "conv",
      lv: 0,
      ob: null,
      ex: null,
      fb: "",
      g: "AND",
      A: 0,
      B: 0,
      px: null,
      pf: "",
      vt: "",
      q: null,
      qa: null,
    },
      bits = [0, 0, 0, 0, 1, 0, 1, 1];

    /* ==========================================================
       ENCABEZADO · BITS INTERACTIVOS
       ========================================================== */
    function hero() {
      const v = parseInt(bits.join(""), 2);
      $("#hero").innerHTML =
        `<div class="bits">${bits.map((b, i) => `<button class="bit ${b ? "on" : ""}" onclick="bits[${i}]^=1;hero()" aria-label="Bit ${7 - i}: ${b}">${b}</button>`).join("")}</div><p class="rd"><span>Decimal <b>${v}</b></span><span>Octal <b>${S(v, 8)}</b></span><span>Hex <b>${S(v, 16)}</b></span></p>`;
    }

    /* ==========================================================
       SECCIÓN 2 (cont.) · PASOS DE CONVERSIÓN Y OPERACIONES
       cS = conversión, oS = suma, resta, multiplicación y división paso a paso.
       ========================================================== */
    function cS(n, f, t) {
      if (f == 10) {
        const L = [];
        let q = n;
        do {
          const r = q % t;
          L.push(
            `${q} ÷ ${t} = ${Math.floor(q / t)}, residuo ${r}${t == 16 && r > 9 ? " → " + S(r, 16) : ""}`,
          );
          q = Math.floor(q / t);
        } while (q > 0);
        return L.concat(`Leo los residuos de abajo hacia arriba: <b>${S(n, t)}</b>`);
      }
      const d = S(n, f).split(""),
        k = d.length;
      return d
        .map(
          (c, i) =>
            `${c}${f == 16 && parseInt(c, 16) > 9 ? " (=" + parseInt(c, 16) + ")" : ""} × ${f}<sup>${k - 1 - i}</sup> = ${parseInt(c, f) * f ** (k - 1 - i)}`,
        )
        .concat(`Sumo los valores: <b>${n}</b> (decimal)`);
    }
    function oS(op, a, b, B) {
      const x = S(a, B).split("").reverse(),
        y = S(b, B).split("").reverse(),
        L = [];
      if (B == 16 && op != "mul" && op != "div")
        L.push("Valores de los dígitos en decimal (A=10 … F=15).");
      if (op == "add" || op == "sub") {
        let c = 0;
        const n = Math.max(x.length, y.length);
        for (let i = 0; i < n; i++) {
          const p = parseInt(x[i] || "0", B),
            q = parseInt(y[i] || "0", B);
          if (op == "add") {
            const t = p + q + c;
            L.push(
              `Columna ${i + 1}: ${p} + ${q}${c ? " + 1 (acarreo)" : ""} = ${t}${t >= B ? ` → ${B} + ${t - B}: escribo ${S(t - B, B)} y llevo 1` : ` → escribo ${S(t, B)}`}`,
            );
            c = t >= B ? 1 : 0;
          } else {
            const raw = p - c - q,
              nc = raw < 0 ? 1 : 0,
              t = raw + nc * B;
            L.push(
              `Columna ${i + 1}: ${p}${c ? " − 1 (préstamo anterior)" : ""} − ${q} = ${raw}${nc ? `; es negativo, pido prestado ${B}: ${raw} + ${B} = ${t}` : ""} → escribo ${S(t, B)}`,
            );
            c = nc;
          }
        }
        if (op == "add" && c) L.push("Llevada final: escribo 1 a la izquierda.");
        L.push(`Resultado: <b>${S(op == "add" ? a + b : a - b, B)}</b>`);
      }
      if (op == "mul") {
        y.forEach((c, i) => {
          const d = parseInt(c, B);
          L.push(
            `Dígito ${c}: ${S(a, B)} × ${c} = ${S(a * d, B)}${i ? `, desplazado ${i} lugar(es) → ${S(a * d * B ** i, B)}` : ""}`,
          );
        });
        L.push(`Suma de parciales: <b>${S(a * b, B)}</b>`);
      }
      if (op == "div") {
        let r = 0,
          q = "";
        S(a, B)
          .split("")
          .forEach((c) => {
            const cur = r * B + parseInt(c, B),
              d = Math.floor(cur / b);
            r = cur - d * b;
            q += S(d, B);
            L.push(
              `Resto parcial ${S(cur, B)} ÷ ${S(b, B)} → cifra ${S(d, B)}, sobra ${S(r, B)}`,
            );
          });
        L.push(
          `Cociente <b>${S(Math.floor(a / b), B)}</b>, residuo <b>${S(a % b, B)}</b>. Comprobación: ${S(b, B)} × ${S(Math.floor(a / b), B)} + ${S(a % b, B)} = ${S(a, B)}`,
        );
        L.push(
          a % b
            ? `La división no es exacta: el resultado fraccionario sería ${(a / b).toFixed(4)} en decimal. Aquí se pide solo la parte entera y el residuo.`
            : "La división es exacta: el resultado es entero y el residuo es 0.",
        );
      }
      return L;
    }

    /* ==========================================================
       SECCIÓN 2 (cont.) · EJERCICIOS: GENERAR, COMPROBAR Y MOSTRAR SOLUCIÓN
       ========================================================== */
    function ob() {
      const [f, t] = MODS[st.m];
      if (![f, t].includes(st.ob)) st.ob = f == 10 ? t : f;
      return st.ob;
    }
    function gen() {
      st.fb = "";
      const lv = st.lv;
      if (st.mode == "conv") {
        st.ex = { n: R(1, [15, 255, 4095][lv]) };
        return;
      }
      const op = st.mode,
        mx = (op == "mul" ? [7, 15, 63] : [15, 63, 255])[lv];
      let a = R(1, mx),
        b = R(1, mx);
      if (op == "sub" && a < b) [a, b] = [b, a];
      if (op == "div") {
        b = R(2, Math.max(3, mx >> 1));
        a = b * R(1, Math.max(2, mx >> 2)) + R(0, b - 1);
      }
      st.ex = { a, b };
    }
    function expd() {
      const [f, t] = MODS[st.m],
        B = ob(),
        e = st.ex;
      if (st.mode == "conv") return { base: t, v: [S(e.n, t)], s: cS(e.n, f, t) };
      const { a, b } = e,
        op = st.mode,
        v = { add: a + b, sub: a - b, mul: a * b }[op];
      return {
        base: B,
        v: op == "div" ? [S(Math.floor(a / b), B), S(a % b, B)] : [S(v, B)],
        s: oS(op, a, b, B),
      };
    }
    function chk() {
      const x = expd(),
        ins = [...document.querySelectorAll("#ex input")].map((i) =>
          i.value.trim().toUpperCase(),
        );
      if (ins.some((v) => !v)) {
        st.fb = '<div class="fb bad">Escribe tu respuesta antes de comprobar.</div>';
        return draw(1);
      }
      const bad = ins.find((v) => !new RegExp("^[" + RX[x.base] + "]+$").test(v));
      if (bad) {
        st.fb = `<div class="fb bad">“${bad}” no es válido en ${NM[x.base]}. Dígitos permitidos: ${DG[x.base]}.</div>`;
        return draw(1);
      }
      const ok = ins.every((v, i) => v.replace(/^0+(?=.)/, "") == x.v[i]);
      st.fb = `<div class="fb ${ok ? "ok" : "bad"}"><b>${ok ? "¡Correcto!" : "Aún no."}</b> ${ok ? "" : "La respuesta es "}${ok ? "" : x.v.join(" y residuo ")}<ol class="st">${x.s.map((l) => `<li>${l}</li>`).join("")}</ol></div>`;
      draw(1);
    }
    function sol() {
      const x = expd();
      st.fb = `<div class="fb ok"><b>Solución: ${x.v.join(" y residuo ")}</b><ol class="st">${x.s.map((l) => `<li>${l}</li>`).join("")}</ol></div>`;
      draw(1);
    }

    /* ==========================================================
       SECCIÓN 2 (cont.) · VISTA DEL MÓDULO DE NUMERACIÓN
       ========================================================== */
    function viewNum() {
      const [f, t] = MODS[st.m],
        B = ob();
      if (!st.ex) gen();
      const e = st.ex,
        conv = st.mode == "conv";
      let prompt, ex, inputs;
      if (conv) {
        prompt = `Convierte <b class="mono">${S(e.n, f)}</b><sub>${f}</sub> (${NM[f]}) a ${NM[t]}.`;
        inputs = `<input aria-label="Respuesta en ${NM[t]}" placeholder="Base ${t}" autocomplete="off">`;
        const n = 45;
        ex = `<span class="ex">${S(n, f)}<sub>${f}</sub> → ${S(n, t)}<sub>${t}</sub></span><ol class="st">${cS(
          n,
          f,
          t,
        )
          .map((l) => `<li>${l}</li>`)
          .join("")}</ol>`;
      } else {
        const op = st.mode,
          [a, b] = EXA[op];
        prompt = `Actividad en base ${NM[B]} (no es una conversión): <b class="mono">${S(e.a, B)} ${SYM[op]} ${S(e.b, B)}</b>. Responde en base ${B}.`;
        inputs =
          op == "div"
            ? `<input aria-label="Cociente" placeholder="Cociente" autocomplete="off"><input aria-label="Residuo" placeholder="Residuo" autocomplete="off">`
            : `<input aria-label="Resultado" placeholder="Resultado base ${B}" autocomplete="off">`;
        ex = `<span class="ex">${S(a, B)} ${SYM[op]} ${S(b, B)}</span><ol class="st">${oS(
          op,
          a,
          b,
          B,
        )
          .map((l) => `<li>${l}</li>`)
          .join("")}</ol>`;
      }
      return `<div class="pills">${MODS.map((m, i) => `<button class="pill ${i == st.m ? "a" : ""}" onclick="st.m=${i};st.ob=null;st.ex=null;draw()">${cap(NM[m[0]])} a ${NM[m[1]]}</button>`).join("")}</div>
<div class="card"><h2>${cap(NM[f])} a ${NM[t]}</h2>${[f, t].map((b) => `<p><b>${cap(NM[b])}.</b> ${TH[b]}</p>`).join("")}
<h3>Procedimiento</h3><p>${f == 10 ? `Divisiones sucesivas: divide entre ${t} hasta llegar a 0 y lee los residuos de abajo hacia arriba.` : `Valor posicional: multiplica cada dígito por ${f} elevado a su posición (de derecha a izquierda, empezando en 0) y suma.`}</p></div>
<div class="pills" role="tablist">${MODES.map((m) => `<button class="pill ${st.mode == m[0] ? "a" : ""}" onclick="st.mode='${m[0]}';gen();draw()">${m[1]}</button>`).join("")}</div>

          Q = pick(Rs);
          I = V / Q;
          g = `V = ${V} V y R = ${Q} Ω`;
          m = ["I (A)", I, `I = V/R = ${V}/${Q}`];
        } else if (k == 1) {
          I = pick(Is);
          Q = pick(Rs);
          V = I * Q;
          g = `I = ${I} A y R = ${Q} Ω`;
          m = ["V (V)", V, `V = I·R = ${I}·${Q}`];
        } else {
          V = pick(Vs);
          I = pick(Is);
          Q = V / I;
          g = `V = ${V} V e I = ${I} A`;
          m = ["R (Ω)", Q, `R = V/I = ${V}/${I}`];
        }
        const P = V * I;
        return {
          q: `Dados ${g}, calcula la incógnita y la potencia.`,
          f: [m[0], "P (W)"],
          a: [m[1], P],
          s: [`${m[2]} = ${fx(m[1])}`, `P = V·I = ${fx(V)}·${fx(I)} = ${fx(P)} W`],
        };
      },
      kirch: () => {
        const V1 = pick([12, 24]),
          V2 = pick([6, 9, 12]),
          R1 = pick([1, 2, 4]),
          R2 = pick([1, 2, 4]),
          R3 = pick([2, 4, 8]),
          s = kS(V1, V2, R1, R2, R3);
        return {
          q: `Dos fuentes de ${V1} V y ${V2} V (positivo arriba) alimentan, mediante R1 = ${R1} Ω y R2 = ${R2} Ω, un nodo central unido a tierra por R3 = ${R3} Ω. Calcula las corrientes I₁ (por R1), I₂ (por R2) e I₃ (por R3).`,
          f: ["I₁ (A)", "I₂ (A)", "I₃ (A)"],
          a: [s.I1, s.I2, s.I3],
          s: [
            `Tensión del nodo: (V₁/R₁+V₂/R₂)/(1/R₁+1/R₂+1/R₃) = ${fx(s.Vt)} V`,
            `I₁ = (V₁−Vₙ)/R₁ = ${fx(s.I1)} A; I₂ = (V₂−Vₙ)/R₂ = ${fx(s.I2)} A; I₃ = Vₙ/R₃ = ${fx(s.I3)} A`,
            "Ley de nodos: I₁ + I₂ = I₃",
          ],
        };
      },
    };
    // --- 5.9 Preguntas de teoría ---
    const QZ = {
      atom: [
        [
          "¿Qué carga tiene un neutrón?",
          ["Positiva", "Negativa", "Neutra (0 C)"],
          2,
          "El neutrón no tiene carga; está en el núcleo junto a los protones.",
        ],
        [
          "Si un átomo pierde electrones se convierte en…",
          ["un anión (ion negativo)", "un catión (ion positivo)", "un neutrón"],
          1,
          "Pierde carga negativa y queda con exceso de protones: ion positivo.",
        ],
        [
          "Dos cargas del mismo signo…",
          ["se atraen", "se repelen", "no interactúan"],
          1,
          "Cargas iguales se repelen; opuestas se atraen.",
        ],
      ],
      coul: [
        [
          "Si se duplica la distancia entre dos cargas, la fuerza…",
          ["se duplica", "se reduce a la mitad", "se reduce a la cuarta parte"],
          2,
          "F es inversamente proporcional a r²: (1/2)² = 1/4.",
        ],
      ],
      unid: [
        [
          "La corriente alterna se caracteriza porque…",
          [
            "siempre tiene el mismo sentido",
            "su magnitud y dirección varían cíclicamente",
            "solo cambia de magnitud",
          ],
          1,
          "La pulsante cambia de magnitud, pero no de sentido.",
        ],
        [
          "La unidad de la potencia eléctrica es…",
          ["el julio", "el vatio (W = J/s)", "el voltio"],
          1,
          "1 W = 1 J/s.",
        ],
        [
          "La corriente eléctrica es…",
          [
            "carga por unidad de tiempo",
            "energía por unidad de carga",
            "oposición al paso de carga",
          ],
          0,
          "i = dq/dt. La energía por unidad de carga es la tensión.",
        ],
      ],
      res: [
        [
          "Si aumenta la longitud de un conductor, su resistencia…",
          ["aumenta", "disminuye", "no cambia"],
          0,
          "R = ρ·l/A: es directamente proporcional a la longitud.",
        ],
      ],
      cod: [["Un SMD marcado “472” vale…", ["472 Ω", "4,7 kΩ", "47 kΩ"], 1, "47×10² = 4700 Ω."]],
      circ: [
        [
          "En un circuito en paralelo, ¿qué es igual en todas las ramas?",
          ["La corriente", "La tensión", "La resistencia"],
          1,
          "V<sub>T</sub> = V₁ = V₂ = V₃; las corrientes se suman.",
        ],
      ],
      ohm: [
        [
          "Una plancha de 1000 W a 220 V consume aproximadamente…",
          ["0,22 A", "4,5 A", "220 A"],
          1,
          "I = P/V = 1000/220 ≈ 4,55 A.",
        ],
      ],
      kir: [
        [
          "En un nodo, la suma de corrientes que entran es…",
          ["mayor que la que sale", "igual a la que sale", "menor que la que sale"],
          1,
          "Conservación de la carga.",
        ],
        [
          "En una malla, ΣV = Σ(I·R) significa que…",
          [
            "las subidas de tensión igualan las caídas",
            "la corriente siempre vale cero",
            "las resistencias se anulan",
          ],
          0,
          "Conservación de la energía a lo largo de la malla.",
        ],
      ],
    };
    // --- 5.10 Funciones de la interfaz (calculadora, comprobar, vista) ---
    function calcHTML(k) {
      const c = CA[k];
      return `<div class="card"><h3 style="margin-top:0">Calculadora</h3>${c.f.map((f) => `<label class="lbl">${f[1]} ${f[3] ? `<select id="c_${f[0]}" onchange="cr('${k}')">${f[3].map((o) => `<option value="${o[0]}"${o[0] == f[2] ? " selected" : ""}>${o[1]}</option>`).join("")}</select>` : `<input id="c_${f[0]}" value="${f[2]}" oninput="cr('${k}')" style="width:${f[0] == "R" && k == "circ" ? 220 : 120}px">`}</label>`).join("")}<div id="cres" style="margin-top:10px"></div></div>`;
    }
    function cr(k) {
      const c = CA[k];
      $("#cres").innerHTML = c.run(c.f.map((f) => $("#c_" + f[0]).value));
    }
    function ec() {
      const t = E.t,
        v = [...document.querySelectorAll("#ee input")].map((i) => nn(i.value));
      if (v.some((x) => x == null)) {
        E.fb = '<div class="fb bad">Escribe un número en cada campo.</div>';
        return draw(1);
      }
      const ok = v.every(
        (x, i) => Math.abs(x - t.a[i]) <= Math.max(Math.abs(t.a[i]) * 0.01, 1e-9),
      );
      E.fb = `<div class="fb ${ok ? "ok" : "bad"}"><b>${ok ? "¡Correcto!" : "Aún no."}</b> ${ok ? "" : "Respuesta: " + t.a.map(fx).join(" ; ")}<ol class="st">${t.s.map((l) => `<li>${l}</li>`).join("")}</ol></div>`;
      draw(1);
    }
    function es() {
      const t = E.t;
      E.fb = `<div class="fb ok"><b>Solución: ${t.a.map(fx).join(" ; ")}</b><ol class="st">${t.s.map((l) => `<li>${l}</li>`).join("")}</ol></div>`;
      draw(1);
    }
    function viewE() {
      const k = E.s,
        m = EM.find((x) => x[0] == k);
      if (!E.t && TKS[k]) E.t = TK[pick(TKS[k])]();
      const z = QZ[k],
        q = z[E.qi % z.length];
      return `<div class="pills">${EM.map((x) => `<button class="pill ${x[0] == k ? "a" : ""}" onclick="E.s='${x[0]}';E.t=null;E.fb='';E.qa=null;E.qi=0;draw()">${x[1]}</button>`).join("")}</div>
<div class="card"><h2>${m[1]}</h2>${m[2].map((p) => `<p>${p}</p>`).join("")}</div>
${EX[k] ? `<div class="card"><h3 style="margin-top:0">Ejemplos resueltos</h3>${EX[k]()}</div>` : ""}
${CA[k] ? calcHTML(k) : ""}
${E.t ? `<div class="card" id="ee"><h3 style="margin-top:0">Ejercicio</h3><p>${E.t.q}</p>${E.t.f.map((l) => `<input aria-label="${l}" placeholder="${l}" inputmode="decimal" autocomplete="off">`).join("")}<p class="lbl">Se acepta un margen del 1 % por redondeo.</p><div><button class="btn" onclick="ec()">Comprobar</button><button class="btn s" onclick="E.t=null;E.fb='';draw()">Otro ejercicio</button><button class="btn s" onclick="es()">Ver solución</button></div>${E.fb}</div>` : ""}
<div class="card"><h3 style="margin-top:0">Pregunta de teoría</h3><p><b>${q[0]}</b></p>${q[1].map((o, i) => `<button class="btn s" onclick="E.qa=${i};draw(1)">${o}</button>`).join("")}${E.qa != null ? `<div class="fb ${E.qa == q[2] ? "ok" : "bad"}"><b>${E.qa == q[2] ? "¡Correcto!" : "Incorrecto."}</b> ${q[3]}</div>` : ""}<div><button class="btn" onclick="E.qi++;E.qa=null;draw(1)">Otra pregunta</button></div></div>`;
    }

    /* ==========================================================
       PANTALLA PRINCIPAL · NAVEGACIÓN Y ARRANQUE
       draw() dibuja las pestañas y la vista activa; al final se inicia la página.
       ========================================================== */
    function draw(keep) {
      const T = [
        ["num", "Conversiones y aritmética"],
        ["gates", "Puertas lógicas"],
        ["bool", "Álgebra booleana"],
        ["elec", "Fundamentos de electrónica"],
      ];
      $("#nav").innerHTML = T.map(
        (t) =>
          `<button class="tab ${st.tab == t[0] ? "a" : ""}" onclick="st.tab='${t[0]}';draw()">${t[1]}</button>`,
      ).join("");
      const y = scrollY;
      $("#app").innerHTML =
        st.tab == "num"
          ? viewNum()
          : st.tab == "gates"
            ? viewG()
            : st.tab == "elec"
              ? viewE()
              : viewB();
      if (st.tab == "elec" && CA[E.s]) cr(E.s);
      if (keep) scrollTo(0, y);
    }
    // Inicio

    hero();
    draw();
  </script>
</body>
